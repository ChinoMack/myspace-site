name: Connect Music Link

on:
  push:
    paths:
      - '.github/workflows/connect-music-link.yml'

permissions:
  contents: write

jobs:
  connect-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Music button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<li><a href="#">Music</a></li>'
          new = '<li><a href="music.html">Music</a></li>'
          if old not in s:
              raise SystemExit('Music link pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit link change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link Music button to music player"
          git push
